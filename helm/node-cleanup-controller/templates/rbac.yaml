{{- if .Values.rbac.create }}
---
# The controller watches PVs, PVCs and Nodes, deletes the PVs and PVCs of deleted
# Nodes, and emits an event before deleting a PVC. The event recorder patches an
# event that repeats instead of creating a new one.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ template "node-cleanup.fullname" . }}
  labels:
    {{- include "node-cleanup.labels" . | nindent 4 }}
rules:
- apiGroups: [""]
  resources: ["persistentvolumes", "persistentvolumeclaims"]
  verbs: ["get", "list", "watch", "delete"]
- apiGroups: [""]
  resources: ["nodes"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["events"]
  verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ template "node-cleanup.fullname" . }}
  labels:
    {{- include "node-cleanup.labels" . | nindent 4 }}
subjects:
- kind: ServiceAccount
  name: {{ template "node-cleanup.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ template "node-cleanup.fullname" . }}
{{- end }}
