---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "node-cleanup.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "node-cleanup.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "node-cleanup.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "node-cleanup.selectorLabels" . | nindent 8 }}
{{- if .Values.podLabels }}
{{ .Values.podLabels | toYaml | trim | indent 8 }}
{{- end }}
{{- if .Values.podAnnotations }}
      annotations:
{{ .Values.podAnnotations | toYaml | trim | indent 8 }}
{{- end }}
    spec:
      serviceAccountName: {{ template "node-cleanup.serviceAccountName" . }}
{{- if .Values.priorityClassName }}
      priorityClassName: {{ .Values.priorityClassName }}
{{- end }}
{{- if .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml .Values.imagePullSecrets | nindent 8 }}
{{- end }}
      nodeSelector:
        kubernetes.io/os: linux
{{- if .Values.nodeSelector }}
        {{- toYaml .Values.nodeSelector | nindent 8 }}
{{- end }}
{{- if .Values.tolerations }}
      tolerations:
        {{- toYaml .Values.tolerations | nindent 8 }}
{{- end }}
{{- if .Values.affinity }}
      affinity:
        {{- toYaml .Values.affinity | nindent 8 }}
{{- end }}
{{- if .Values.podSecurityContext }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
{{- end }}
      containers:
        - name: node-cleanup-controller
          image: {{ tpl .Values.image . }}
          {{- if .Values.imagePullPolicy }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          {{- end }}
          args:
            - --storageclass-names={{ join "," .Values.storageClassNames }}
{{- if .Values.csiDrivers }}
            - --csi-drivers={{ join "," .Values.csiDrivers }}
{{- end }}
            - --pvc-deletion-delay={{ .Values.pvcDeletionDelay }}
            - --stale-pv-discovery-interval={{ .Values.stalePVDiscoveryInterval }}
{{- range .Values.additionalArgs }}
            - {{ . }}
{{- end }}
          ports:
            - name: metrics
              containerPort: 8080
          livenessProbe:
            tcpSocket:
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 60
{{- if .Values.resources }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
{{- end }}
{{- if .Values.securityContext }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
{{- end }}
