---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "node-cleanup.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "node-cleanup.labels" . | nindent 4 }}
spec:
  # The controller has no leader election, so a second replica, even the surge Pod of
  # a rolling update, would race the first one to delete the same objects.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "node-cleanup.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "node-cleanup.selectorLabels" . | nindent 8 }}
{{- if .Values.podLabels }}
{{ .Values.podLabels | toYaml | trim | indent 8 }}
{{- end }}
{{- if .Values.podAnnotations }}
      annotations:
{{ .Values.podAnnotations | toYaml | trim | indent 8 }}
{{- end }}
    spec:
      serviceAccountName: {{ template "node-cleanup.serviceAccountName" . }}
{{- if .Values.priorityClassName }}
      priorityClassName: {{ .Values.priorityClassName }}
{{- end }}
{{- if .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml .Values.imagePullSecrets | nindent 8 }}
{{- end }}
      nodeSelector:
        {{- merge (dict "kubernetes.io/os" "linux") .Values.nodeSelector | toYaml | nindent 8 }}
{{- if .Values.tolerations }}
      tolerations:
        {{- toYaml .Values.tolerations | nindent 8 }}
{{- end }}
{{- if .Values.affinity }}
      affinity:
        {{- toYaml .Values.affinity | nindent 8 }}
{{- end }}
{{- if .Values.podSecurityContext }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
{{- end }}
      containers:
        - name: node-cleanup-controller
          image: {{ tpl .Values.image . }}
          {{- if .Values.imagePullPolicy }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          {{- end }}
          args:
            - {{ printf "--storageclass-names=%s" (join "," .Values.storageClassNames) | quote }}
{{- if .Values.csiDrivers }}
            - {{ printf "--csi-drivers=%s" (join "," .Values.csiDrivers) | quote }}
{{- end }}
            - {{ printf "--pvc-deletion-delay=%s" .Values.pvcDeletionDelay | quote }}
            - {{ printf "--stale-pv-discovery-interval=%s" .Values.stalePVDiscoveryInterval | quote }}
            - {{ printf "--listen-address=:%v" .Values.metrics.port | quote }}
            - {{ printf "--metrics-path=%s" .Values.metrics.path | quote }}
{{- range .Values.additionalArgs }}
            - {{ . | quote }}
{{- end }}
          ports:
            - name: metrics
              containerPort: {{ .Values.metrics.port }}
          livenessProbe:
            tcpSocket:
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 60
{{- if .Values.resources }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
{{- end }}
{{- if .Values.securityContext }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
{{- end }}
